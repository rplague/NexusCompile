[package]
name = "NexusCompile"
version = "0.1.4-11175"
edition = "2024"

[lib]
name = "nexuscompile"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = "0.4.44"
ciborium = "0.2"
colored = "3.1.1"
flate2 = "1.1.9"
scopeguard = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
toml_edit = "0.22"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
walkdir = "2"
